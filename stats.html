<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #22d3ee; --violet: #a78bfa; --success: #10b981;
      --bg: #0b1220; --surface: #111827; --surface2: #1a2436;
      --text: #e2e8f0; --muted: #64748b; --muted2: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { 
      width: 100%; height: 100%; background: transparent; 
      font-family: 'Syne', sans-serif; overflow: hidden;
    }
    .stats-card {
      width: 380px; height: 420px; background: var(--surface);
      border-radius: 24px; padding: 24px; border: 1px solid rgba(34,211,238,0.2);
      box-shadow: 0 25px 80px rgba(0,0,0,0.7), 0 0 40px rgba(34,211,238,0.08);
      display: flex; flex-direction: column; gap: 20px;
    }
    .header { display: flex; align-items: center; gap: 12px; }
    .icon { width: 36px; height: 36px; background: rgba(34,211,238,0.15); border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    .icon svg { width: 18px; height: 22px; fill: var(--cyan); }
    h2 { font-size: 18px; font-weight: 700; color: var(--cyan); }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .stat-card {
      background: var(--surface2); border-radius: 16px; padding: 20px;
      text-align: center; border: 1px solid rgba(255,255,255,0.05);
    }
    .stat-value { font-size: 28px; font-weight: 700; color: var(--cyan); font-family: 'JetBrains Mono', monospace; }
    .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }
    .streak-hot { color: var(--success) !important; }
    .chart-placeholder {
      grid-column: 1 / -1; height: 140px; background: linear-gradient(135deg, rgba(34,211,238,0.08), rgba(167,139,250,0.08));
      border-radius: 16px; display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(34,211,238,0.15); font-family: 'JetBrains Mono'; font-size: 11px; color: var(--muted);
    }
    .close-btn {
        position: absolute; top: 12px; right: 16px;
        background: none; border: none; color: var(--muted);
        font-size: 20px; cursor: pointer; line-height: 1;
        opacity: 0.6; transition: opacity 0.2s;
    }
    .close-btn:hover { opacity: 1; }
    .stats-card { position: relative; }  /* Ajoute ça */
    .footer { 
      padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.05);
      text-align: center; font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono';
    }
  </style>
</head>
<body>
  <div class="stats-card" id="statsCard">
    <div class="header">
      <div class="icon">
        <svg viewBox="0 0 18 22">
          <path d="M9 1C9 1 1 8.5 1 14C1 18.4 4.6 21 9 21C13.4 21 17 18.4 17 14C17 8.5 9 1 9 1Z" fill="currentColor"/>
        </svg>
      </div>
      <h2>Stats HydraDev</h2>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="glassesToday">5</div>
        <div class="stat-label">verres aujourd'hui</div>
      </div>
      <div class="stat-card">
        <div class="stat-value streak-hot" id="streakDays">3</div>
        <div class="stat-label">streak</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="avgGlasses">32</div>
        <div class="stat-label">semaine moyenne</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="bestStreak">7</div>
        <div class="stat-label">meilleur streak</div>
      </div>
    </div>

    <div class="chart-placeholder">
      📊 Graph verres/semaine (V2 avec Chart.js)
    </div>

    <div class="footer">
      <div>Glasses total : <span id="totalGlassesEver" style="color: var(--cyan);">42</span></div>
      <div style="margin-top: 4px;">App démarrée depuis 2j 🧠</div>
    </div>

    <button class="close-btn" onclick="closeStats()" title="Fermer">×</button>
  </div>

  <script>
    let ipcRenderer;
    try { ipcRenderer = require('electron').ipcRenderer; } catch(e) {}
    
    function updateStats(state) {
      document.getElementById('glassesToday').textContent = state.glasses;
      document.getElementById('streakDays').textContent = state.streak;
      document.getElementById('totalGlassesEver').textContent = state.totalGlassesEver || 42;
      // Ajoute plus de stats plus tard
    }
    
    if (ipcRenderer) {
      ipcRenderer.on('stats-data', (e, state) => updateStats(state));
      ipcRenderer.send('request-stats');  // Demande data
    }
    function closeStats() {
    if (ipcRenderer) ipcRenderer.send('close-stats');
    else window.close();
    }
  </script>
</body>
</html>
